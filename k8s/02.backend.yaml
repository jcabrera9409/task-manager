apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-backend
  namespace: test
  labels:
    app: task-manager-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager-backend
  template:
    metadata:
      labels:
        app: task-manager-backend
    spec:
      containers:
      - name: task-manager-backend
        image: jcabrera9409/task-manager-backend:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: DATASOURCE_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: DATASOURCE_DATABASE
        - name: JWT_PUBLIC_KEY_PATH
          value: "/work/publicKey.pem"
        - name: JWT_PRIVATE_KEY_PATH
          value: "/work/privateKey.pem"
        - name: DATASOURCE_HOST
          value: "mysql-service"
        - name: DATASOURCE_PORT
          value: "3306"
        volumeMounts:
        - name: jwt-keys-volume
          mountPath: /work
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: jwt-keys-volume
        configMap:
          name: jwt-keys
          items:
          - key: privateKey.pem
            path: privateKey.pem
          - key: publicKey.pem
            path: publicKey.pem
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-backend-service
  namespace: test
  labels:
    app: task-manager-backend
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: task-manager-backend
  type: ClusterIP