apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-backend
  namespace: test
  labels:
    app: task-manager-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-manager-backend
  template:
    metadata:
      labels:
        app: task-manager-backend
    spec:
      containers:
      - name: task-manager-backend
        image: jcabrera9409/task-manager-backend:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: USER_BD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: PASSWORD_BD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: DATASOURCE_BD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: DATASOURCE_DATABASE
        - name: JWT_PUBLIC_KEY_PATH
          value: "/app/keys/publicKey.pem"
        - name: JWT_PRIVATE_KEY_PATH
          value: "/app/keys/privateKey.pem"
        volumeMounts:
        - name: jwt-keys-volume
          mountPath: /app/keys
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: jwt-keys-volume
        configMap:
          name: jwt-keys
          items:
          - key: privateKey.pem
            path: privateKey.pem
          - key: publicKey.pem
            path: publicKey.pem
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-backend-service
  namespace: test
  labels:
    app: task-manager-backend
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: task-manager-backend
  type: ClusterIP