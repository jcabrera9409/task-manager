apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

resources:
  - 00.namespace.yaml
  - 01.mysql.yaml
  - 02.backend.yaml
  - 03.frontend.yaml
  - 05.nginx-proxy.yaml
  # - 04.ingress.yaml  # Commented out until Ingress Controller is installed

secretGenerator:
  - name: mysql-secret
    envs:
      - .env

configMapGenerator:
  - name: jwt-keys
    files:
      - dev/privateKey.pem
      - dev/publicKey.pem