apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

resources:
  - 00.namespace.yaml
  - 01.mysql.yaml
  - 02.backend.yaml

secretGenerator:
  - name: mysql-secret
    envs:
      - .env

configMapGenerator:
  - name: jwt-keys
    files:
      - dev/privateKey.pem
      - dev/publicKey.pem