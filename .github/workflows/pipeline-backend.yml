name: Backend CI Pipeline

on:
  push:
    branches: [main]
    paths:
      [
        "task-manager-backend/src/**",
        "task-manager-backend/docker/**",
        "task-manager-backend/pom.xml",
        ".github/workflows/pipeline-backend.yml",
      ]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  avoid_redundant:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

  unit_tests:
    needs: avoid_redundant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Setup JWT Keys
        run: |
          mkdir -p /tmp/jwt-keys
          echo "${{ secrets.PRIVATE_KEY }}" > /tmp/jwt-keys/privateKey.pem
          echo "${{ secrets.PUBLIC_KEY }}" > /tmp/jwt-keys/publicKey.pem
          chmod 600 /tmp/jwt-keys/privateKey.pem
          chmod 644 /tmp/jwt-keys/publicKey.pem

      - name: Run Unit Tests
        env:
          JWT_PRIVATE_KEY_PATH: file:/tmp/jwt-keys/privateKey.pem
          JWT_PUBLIC_KEY_PATH: file:/tmp/jwt-keys/publicKey.pem
        run: |
          cd task-manager-backend
          mvn test

  trivy_scan:
    needs: avoid_redundant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "task-manager-backend/"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          scanners: "vuln"

  build:
    needs: [unit_tests, trivy_scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build
        run: |
          cd task-manager-backend
          mvn clean package -Dnative \
              -Dquarkus.native.container-build=true \
              -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
              -DskipTests
              
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: task-manager-backend/target/*-runner

  dockerize_and_push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create target directory
        run: mkdir -p task-manager-backend/target

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: task-manager-backend/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/task-manager-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: task-manager-backend
          file: task-manager-backend/docker/Dockerfile.native-micro
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
