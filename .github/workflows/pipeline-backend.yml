name: Backend CI Pipeline

on:
  push:
    branches: [main]
    paths: ["task-manager-backend/**", ".github/workflows/pipeline-backend.yml"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  avoid_redundant:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.9.1
        with:
          access_token: ${{ github.token }}

  dependencies:
    needs: avoid_redundant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Download Maven dependencies
        run: |
          cd task-manager-backend
          mvn dependency:go-offline

  unit_tests:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Unit Tests
        run: |
          cd task-manager-backend
          mvn test

  trivy_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'task-manager-backend/'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  build:
    needs: [unit_tests, trivy_scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build
        run: |
          cd task-manager-backend
          mvn package -Dnative -Dquarkus.native.container-build=true
      
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target

  dockerize_and_push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: task-manager-backend
          file: task-manager-backend/docker/Dockerfile.native-micro
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:latest
